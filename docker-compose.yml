services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      DATA_MODE: ${DATA_MODE:-sqlite}
      APP_ORIGIN: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in your environment or .env file}
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/balsathi.db}
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
      ML_MODEL_PATH: ${ML_MODEL_PATH:-}
      ML_EVALUATION_PATH: ${ML_EVALUATION_PATH:-}
      PYTHON_BIN: ${PYTHON_BIN:-python3}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - balsathi-data:/app/data

volumes:
  balsathi-data:
