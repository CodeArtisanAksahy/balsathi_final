services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      DATA_MODE: demo
      APP_ORIGIN: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in your environment or .env file}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: balsathi
      POSTGRES_USER: balsathi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balsathi -d balsathi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
